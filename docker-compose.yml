version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sarathi_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-chahat}
      MYSQL_DATABASE: ${DB_NAME:-sarathi_sih_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-chahat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: sarathi_web_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-chahat}
      - DB_NAME=${DB_NAME:-sarathi_sih_db}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-sarathi_secret_prod_key_9981}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models

volumes:
  mysql_data:

