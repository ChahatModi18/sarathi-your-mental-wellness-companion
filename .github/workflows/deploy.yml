name: Sarathi CI/CD - Verify & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit-and-test:
    name: 🔍 Audit Structure & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Verify Repository Folder Structure
        run: |
          echo "=== Auditing Repository Folders ==="
          required_dirs=("admin" "backend" "docs" "frontend" "models" "services" "static" "templates" "tests")
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ Required directory present: $dir"
            else
              echo "❌ Missing directory: $dir"
              exit 1
            fi
          done

          echo "=== Verifying Critical Web Deployment Files ==="
          required_files=("app.py" "db_adapter.py" "database_setup.py" "vercel.json" "requirements.txt")
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Required file present: $file"
            else
              echo "❌ Missing file: $file"
              exit 1
            fi
          done

          echo "=== Verifying Desktop GUI Exclusion ==="
          if [ -d "gui_desktop" ]; then
            echo "⚠️ Warning: gui_desktop directory detected in web repository."
          else
            echo "✅ Confirmed: gui_desktop is strictly excluded from web deployment."
          fi

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Web Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Execute Automated Test Suite (58 Tests)
        env:
          VERCEL: "1"
          FLASK_SECRET_KEY: "ci_test_secret_key"
        run: |
          python -m pytest tests/ -v

  deploy-vercel:
    name: 🚀 Deploy to Vercel Production
    needs: audit-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🌐 Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️ Notice: VERCEL_TOKEN secret is not yet set in repository Settings -> Secrets."
            echo "👉 The audit and test suite passed with 100%. To enable automated continuous deployment from Actions, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to GitHub Repository Secrets."
            exit 0
          fi
          npm install --global vercel@latest
          echo "Connecting and deploying to Vercel project..."
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel deploy --prod --yes --token=$VERCEL_TOKEN
